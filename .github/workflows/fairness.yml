name: Fairness proof (simulated)

# Re-plays the NDIMBAL draw on SIMULATED test accounts and records the outcome.
#
# GUARD-RAIL (non-negotiable): this workflow NEVER reads or publishes real pool data —
# no real balances, no real tickets, no real pool total. It only re-runs the fairness
# harness (test/verify-draw.test.js) on the fhEVM mock with its own throw-away accounts,
# then logs a binary result (exactly-three-winners + odds-rise-with-deposit). Everything it
# writes is derived from synthetic data, exactly what the harness already does by design.

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # 40 sampled rounds is plenty: "exactly three winners" is deterministic (true every round),
  # and "bigger deposit lands in the top-3 more often" is already clear-cut at this many samples.
  # The top-3 batched draw is ~10x heavier per round than the old single-winner draw, so 200 rounds
  # OOM'd the CI runner — 40 keeps it fast and green while proving the same thing.
  ROUNDS: "40"
  # Give the fhEVM mock room; it accumulates ciphertexts across rounds.
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  verify-fairness:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # fail fast instead of hanging if something goes wrong
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Fairness harness — SIMULATED accounts only (never the real pool)
        id: harness
        continue-on-error: true
        run: npx hardhat test test/verify-draw.test.js

      - name: Append the result to FAIRNESS_LOG.md
        run: |
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ steps.harness.outcome }}" = "success" ]; then
            RES="PASS — exactly three winners (top-3) every round; bigger deposit lands in the top-3 more"
          else
            RES="FAIL — see run log"
          fi
          echo "| $TS | $ROUNDS | ${{ steps.harness.outcome }} | $RES | [run]($RUN_URL) |" >> FAIRNESS_LOG.md
          git config user.name "ndimbal-fairness-bot"
          git config user.email "actions@users.noreply.github.com"
          git add FAIRNESS_LOG.md
          git commit -m "fairness: simulated verify @ $TS" || echo "nothing to commit"
          git pull --no-edit --no-rebase origin main || true
          git push

      - name: Surface a failing harness as a failing job
        if: steps.harness.outcome != 'success'
        run: exit 1
